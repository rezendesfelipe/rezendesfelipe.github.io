<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Ilustração conceitual de Lost in the Middle</title><desc id="desc">Em um painel escuro, uma curva em U indica que a evidência relevante tende a receber mais atenção no início e no fim de uma janela de contexto do que em seu meio.</desc><defs><linearGradient id="glow" x1="0" x2="1"><stop stop-color="#2fd9f4"/><stop offset="1" stop-color="#7bd0ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".32"/></filter><style>text{font-family:Manrope,'Geist Sans',Arial,sans-serif;fill:#dae2fd}.title{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:28px;font-weight:700}.kicker{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;fill:#2fd9f4}.label{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:16px;font-weight:700}.body{font-size:14px;fill:#c6c6cd}.small{font-size:13px;fill:#c6c6cd}.axis{stroke:#758197;stroke-width:2}.grid{stroke:#45464d;stroke-width:1;stroke-dasharray:4 7}.curve{stroke:url(#glow);stroke-width:6;fill:none;stroke-linecap:round}.dot{fill:#2fd9f4;stroke:#0b1326;stroke-width:4}.band{fill:#2fd9f4;opacity:.09}.band-line{stroke:#2fd9f4;stroke-width:1;stroke-dasharray:5 5;opacity:.55}</style></defs><rect width="1200" height="650" fill="#0b1326"/><circle cx="1050" cy="90" r="250" fill="#2fd9f4" opacity=".035"/><text x="70" y="56" class="kicker">CONTEXT ENGINEERING</text><text x="70" y="94" class="title">Lost in the Middle: posição também altera a utilidade do contexto</text><rect x="70" y="125" width="1060" height="390" rx="16" fill="#171f33" stroke="#45464d" filter="url(#shadow)"/><rect x="472" y="155" width="280" height="290" rx="10" class="band"/><line x1="472" y1="155" x2="472" y2="445" class="band-line"/><line x1="752" y1="155" x2="752" y2="445" class="band-line"/><text x="612" y="183" text-anchor="middle" class="small" fill="#7bd0ff">ZONA DE MAIOR RISCO</text><line x1="175" y1="445" x2="1060" y2="445" class="axis"/><line x1="175" y1="155" x2="175" y2="445" class="axis"/><line x1="175" y1="205" x2="1060" y2="205" class="grid"/><line x1="175" y1="300" x2="1060" y2="300" class="grid"/><line x1="175" y1="395" x2="1060" y2="395" class="grid"/><path d="M205 205 C335 265 420 360 535 385 C650 410 750 395 850 305 C940 225 995 195 1035 190" class="curve"/><circle cx="205" cy="205" r="8" class="dot"/><circle cx="535" cy="385" r="8" class="dot"/><circle cx="1035" cy="190" r="8" class="dot"/><text x="145" y="210" text-anchor="end" class="small">alto</text><text x="145" y="400" text-anchor="end" class="small">baixo</text><text x="205" y="480" text-anchor="middle" class="body">início</text><text x="420" y="480" text-anchor="middle" class="body">primeiro terço</text><text x="612" y="480" text-anchor="middle" class="body">meio</text><text x="835" y="480" text-anchor="middle" class="body">último terço</text><text x="1035" y="480" text-anchor="middle" class="body">fim</text><text x="617" y="555" text-anchor="middle" class="label">posição da evidência relevante na janela de contexto</text><text x="108" y="302" transform="rotate(-90 108 302)" text-anchor="middle" class="label">uso correto da evidência</text><rect x="70" y="590" width="18" height="18" rx="4" fill="#2fd9f4" opacity=".35"/><text x="100" y="604" class="small">Informação importante no meio pode receber menos atenção.</text><line x1="695" y1="599" x2="738" y2="599" class="curve"/><text x="750" y="604" class="small">Curva conceitual; não representa valores experimentais.</text></svg>