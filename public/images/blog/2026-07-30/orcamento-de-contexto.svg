<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">Orçamento de contexto</title><desc id="desc">Em um painel escuro, a janela de contexto é dividida entre instruções, estado, evidências, histórico resumido e uma reserva para resposta e recuperação corretiva.</desc><defs><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".32"/></filter><style>text{font-family:Manrope,'Geist Sans',Arial,sans-serif;fill:#dae2fd}.title{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:28px;font-weight:700}.kicker{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;fill:#2fd9f4}.label{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:16px;font-weight:700}.body{font-size:14px;fill:#c6c6cd}.small{font-size:13px;fill:#c6c6cd}.seg{stroke:#0b1326;stroke-width:4}</style></defs><rect width="1200" height="570" fill="#0b1326"/><circle cx="1120" cy="50" r="230" fill="#2fd9f4" opacity=".035"/><text x="70" y="54" class="kicker">CAPACITY PLANNING PARA AGENTES</text><text x="70" y="92" class="title">Orçamento de contexto: reserve espaço antes de consumir a janela</text><rect x="70" y="125" width="1060" height="170" rx="16" fill="#171f33" stroke="#45464d" filter="url(#shadow)"/><text x="100" y="160" class="small">JANELA DE CONTEXTO DISPONÍVEL</text><rect x="100" y="185" width="1000" height="76" rx="12" fill="#060e20" stroke="#45464d"/><clipPath id="budget"><rect x="100" y="185" width="1000" height="76" rx="12"/></clipPath><g clip-path="url(#budget)"><rect x="100" y="185" width="155" height="76" fill="#2fd9f4" opacity=".88" class="seg"/><rect x="255" y="185" width="170" height="76" fill="#7bd0ff" opacity=".88" class="seg"/><rect x="425" y="185" width="375" height="76" fill="#5bbfae" opacity=".9" class="seg"/><rect x="800" y="185" width="185" height="76" fill="#8dc63f" opacity=".88" class="seg"/><rect x="985" y="185" width="115" height="76" fill="#222a3d" stroke="#2fd9f4" class="seg"/></g><text x="177" y="217" text-anchor="middle" class="label" fill="#00363e">Instruções</text><text x="177" y="240" text-anchor="middle" class="small" fill="#00363e">invariantes</text><text x="340" y="217" text-anchor="middle" class="label" fill="#00363e">Estado</text><text x="340" y="240" text-anchor="middle" class="small" fill="#00363e">da tarefa</text><text x="612" y="217" text-anchor="middle" class="label" fill="#00363e">Evidências</text><text x="612" y="240" text-anchor="middle" class="small" fill="#00363e">para esta decisão</text><text x="892" y="217" text-anchor="middle" class="label" fill="#00363e">Histórico</text><text x="892" y="240" text-anchor="middle" class="small" fill="#00363e">resumido</text><text x="1042" y="217" text-anchor="middle" class="label">Reserva</text><text x="1042" y="240" text-anchor="middle" class="small">resposta</text><text x="100" y="282" class="small">Os tamanhos são ilustrativos: o orçamento muda conforme modelo, tarefa, latência e custo aceitável.</text><rect x="70" y="335" width="1060" height="125" rx="16" fill="#222a3d" stroke="#45464d"/><rect x="100" y="365" width="6" height="65" rx="3" fill="#2fd9f4"/><text x="130" y="382" class="kicker">REGRA DE OPERAÇÃO</text><text x="130" y="412" class="label">Não use toda a capacidade disponível.</text><text x="130" y="437" class="body">Preserve margem para a resposta, chamadas de ferramentas e recuperação corretiva de evidência.</text><rect x="70" y="500" width="14" height="14" rx="3" fill="#2fd9f4"/><text x="94" y="512" class="small">Instruções</text><rect x="222" y="500" width="14" height="14" rx="3" fill="#7bd0ff"/><text x="246" y="512" class="small">Estado</text><rect x="350" y="500" width="14" height="14" rx="3" fill="#5bbfae"/><text x="374" y="512" class="small">Evidências</text><rect x="526" y="500" width="14" height="14" rx="3" fill="#8dc63f"/><text x="550" y="512" class="small">Histórico</text><rect x="680" y="500" width="14" height="14" rx="3" fill="#222a3d" stroke="#2fd9f4"/><text x="704" y="512" class="small">Reserva</text></svg>