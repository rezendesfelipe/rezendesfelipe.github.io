<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Atendimento com contexto seletivo</title><desc id="desc">Diagrama de sequência no qual o bot consulta o estado do atendimento e recupera documentação relevante antes de responder ao cliente e registrar a interação.</desc><defs><style>text{font-family:Manrope,Arial,sans-serif;fill:#dae2fd}.title{font-family:Space Grotesk,Arial,sans-serif;font-size:28px;font-weight:700}.sub{font-size:15px;fill:#c6c6cd}.head{font-size:15px;font-weight:700}.msg{font-size:13px;fill:#c6c6cd}.line{stroke:#45464d;stroke-width:1.5;stroke-dasharray:7 7}.arrow{fill:none;stroke:#2fd9f4;stroke-width:2;marker-end:url(#a)}.ret{fill:none;stroke:#7bd0ff;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#o)}</style><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#2fd9f4"/></marker><marker id="o" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#7bd0ff"/></marker></defs><rect width="1200" height="620" rx="20" fill="#0b1326"/><text x="60" y="62" class="title">Atendimento: contexto seletivo por decisão, não histórico completo</text><text x="60" y="91" class="sub">Sequência: o bot consulta fontes externas e leva ao modelo apenas o que a pergunta atual exige.</text><g stroke="#45464d" stroke-width="1.5"><rect x="55" y="125" width="130" height="54" rx="10" fill="#171f33"/><rect x="270" y="125" width="120" height="54" rx="10" fill="#222a3d" stroke="#2fd9f4"/><rect x="475" y="125" width="155" height="54" rx="10" fill="#171f33"/><rect x="715" y="125" width="170" height="54" rx="10" fill="#171f33"/><rect x="970" y="125" width="120" height="54" rx="10" fill="#222a3d" stroke="#7bd0ff"/></g><text x="120" y="157" text-anchor="middle" class="head">Cliente</text><text x="330" y="157" text-anchor="middle" class="head">Bot</text><text x="552" y="157" text-anchor="middle" class="head">Estado</text><text x="800" y="157" text-anchor="middle" class="head">Conhecimento</text><text x="1030" y="157" text-anchor="middle" class="head">Modelo</text><g class="line"><path d="M120 179V550"/><path d="M330 179V550"/><path d="M552 179V550"/><path d="M800 179V550"/><path d="M1030 179V550"/></g><rect x="322" y="210" width="16" height="280" fill="#2fd9f4" opacity=".25"/><path d="M120 220H330" class="arrow"/><text x="225" y="211" text-anchor="middle" class="msg">1. pergunta atual</text><path d="M330 280H552" class="arrow"/><text x="441" y="271" text-anchor="middle" class="msg">2. consultar pedido e resumo</text><path d="M552 320H330" class="ret"/><text x="441" y="311" text-anchor="middle" class="msg">estado relevante</text><path d="M330 380H800" class="arrow"/><text x="565" y="371" text-anchor="middle" class="msg">3. buscar política ou artigo aplicável</text><path d="M800 420H330" class="ret"/><text x="565" y="411" text-anchor="middle" class="msg">trechos citáveis</text><path d="M330 480H1030" class="arrow"/><text x="680" y="471" text-anchor="middle" class="msg">4. intenção + estado + evidência selecionada</text><path d="M1030 520H330" class="ret"/><text x="680" y="511" text-anchor="middle" class="msg">resposta com fontes</text><path d="M330 550H120" class="arrow"/><text x="225" y="541" text-anchor="middle" class="msg">5. responder e atualizar atendimento</text></svg>