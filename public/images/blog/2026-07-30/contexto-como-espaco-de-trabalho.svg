<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura de contexto como espaço de trabalho</title>
  <desc id="desc">Um evento chega ao orquestrador. Ele consulta estado estruturado, memória curada e evidência recuperada para compor uma janela temporária para o modelo. A decisão é registrada na auditoria.</desc>
  <defs>
    <style>text{font-family:Manrope,'Geist Sans',Arial,sans-serif;fill:#dae2fd}.title{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:28px;font-weight:700}.kicker{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;fill:#2fd9f4}.label{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:16px;font-weight:700}.body{font-size:13px;fill:#c6c6cd}.edge{fill:none;stroke:#2fd9f4;stroke-width:2.2;marker-end:url(#a)}.edge2{fill:none;stroke:#7bd0ff;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#a2)}</style>
    <marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#2fd9f4"/></marker><marker id="a2" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#7bd0ff"/></marker>
  </defs>
  <rect width="1200" height="650" fill="#0b1326"/><circle cx="1100" cy="70" r="230" fill="#2fd9f4" opacity=".035"/>
  <text x="60" y="56" class="kicker">ARQUITETURA DE CONTEXTO</text><text x="60" y="94" class="title">A janela de contexto é o espaço de trabalho da decisão atual</text>
  <rect x="60" y="125" width="1080" height="445" rx="16" fill="#171f33" stroke="#45464d"/>
  <text x="90" y="158" class="kicker">FONTES PERSISTENTES</text><text x="755" y="158" class="kicker">COMPOSIÇÃO TEMPORÁRIA</text>
  <rect x="90" y="205" width="160" height="76" rx="10" fill="#222a3d" stroke="#45464d"/><text x="170" y="236" text-anchor="middle" class="label">Evento</text><text x="170" y="258" text-anchor="middle" class="body">usuário ou sistema</text>
  <rect x="320" y="195" width="200" height="96" rx="12" fill="#222a3d" stroke="#2fd9f4" stroke-width="2"/><text x="420" y="232" text-anchor="middle" class="label">Orquestrador</text><text x="420" y="256" text-anchor="middle" class="body">seleciona e coordena</text><text x="420" y="275" text-anchor="middle" class="body">o menor contexto útil</text>
  <rect x="90" y="365" width="190" height="74" rx="10" fill="#171f33" stroke="#7bd0ff"/><text x="185" y="395" text-anchor="middle" class="label">Estado estruturado</text><text x="185" y="418" text-anchor="middle" class="body">progresso da tarefa</text>
  <rect x="320" y="365" width="190" height="74" rx="10" fill="#171f33" stroke="#5bbfae"/><text x="415" y="395" text-anchor="middle" class="label">Recuperação</text><text x="415" y="418" text-anchor="middle" class="body">evidência sob demanda</text>
  <rect x="550" y="365" width="190" height="74" rx="10" fill="#171f33" stroke="#8dc63f"/><text x="645" y="395" text-anchor="middle" class="label">Memória curada</text><text x="645" y="418" text-anchor="middle" class="body">convenções estáveis</text>
  <rect x="760" y="205" width="270" height="150" rx="14" fill="#222a3d" stroke="#2fd9f4" stroke-width="2"/><text x="895" y="242" text-anchor="middle" class="label">Janela de contexto</text><text x="895" y="270" text-anchor="middle" class="body">objetivo + estado + evidência</text><text x="895" y="291" text-anchor="middle" class="body">somente para a decisão atual</text><line x1="790" y1="315" x2="1000" y2="315" stroke="#45464d"/><text x="895" y="340" text-anchor="middle" class="body">Modelo</text>
  <rect x="830" y="440" width="210" height="74" rx="10" fill="#171f33" stroke="#7bd0ff"/><text x="935" y="470" text-anchor="middle" class="label">Auditoria</text><text x="935" y="493" text-anchor="middle" class="body">fontes, decisão e versão</text>
  <path d="M250 243H320" class="edge"/><path d="M420 291V330H185V365" class="edge"/><path d="M420 291V365" class="edge"/><path d="M420 291V330H645V365" class="edge"/><path d="M280 402H720V270H760" class="edge2"/><path d="M510 402H720V290H760" class="edge2"/><path d="M740 402H760V310" class="edge2"/><path d="M895 355V440" class="edge"/>
  <rect x="90" y="535" width="1010" height="1" fill="#45464d"/><text x="90" y="552" class="body">A janela não é banco de dados, histórico nem auditoria: é uma composição efêmera para a próxima decisão.</text>
</svg>
