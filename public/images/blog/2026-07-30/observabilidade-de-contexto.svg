<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline de observabilidade de contexto</title><desc id="desc">A execução do agente emite sinais de capacidade, custo, latência, qualidade e proveniência. Eles são correlacionados em uma visão operacional que aplica gates e orienta ajustes na seleção de contexto.</desc>
  <defs><style>text{font-family:Manrope,'Geist Sans',Arial,sans-serif;fill:#dae2fd}.title{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:28px;font-weight:700}.kicker{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;fill:#2fd9f4}.label{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:16px;font-weight:700}.body{font-size:13px;fill:#c6c6cd}.edge{fill:none;stroke:#2fd9f4;stroke-width:2.2;marker-end:url(#a)}.feedback{fill:none;stroke:#7bd0ff;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#b)}</style><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#2fd9f4"/></marker><marker id="b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#7bd0ff"/></marker></defs>
  <rect width="1200" height="670" fill="#0b1326"/><text x="60" y="56" class="kicker">OPERAÇÃO E AVALIAÇÃO</text><text x="60" y="94" class="title">Observabilidade: capacidade, qualidade, proveniência e custo</text>
  <rect x="60" y="125" width="1080" height="430" rx="16" fill="#171f33" stroke="#45464d"/>
  <rect x="90" y="210" width="190" height="115" rx="12" fill="#222a3d" stroke="#2fd9f4" stroke-width="2"/><text x="185" y="252" text-anchor="middle" class="label">Execução do agente</text><text x="185" y="278" text-anchor="middle" class="body">decisão + contexto</text><text x="185" y="298" text-anchor="middle" class="body">+ ferramentas</text>
  <rect x="370" y="165" width="225" height="92" rx="10" fill="#171f33" stroke="#7bd0ff"/><text x="482" y="200" text-anchor="middle" class="label">Telemetria</text><text x="482" y="224" text-anchor="middle" class="body">tokens · custo · latência</text>
  <rect x="370" y="340" width="225" height="92" rx="10" fill="#171f33" stroke="#5bbfae"/><text x="482" y="375" text-anchor="middle" class="label">Avaliação</text><text x="482" y="399" text-anchor="middle" class="body">aderência · qualidade · uso</text>
  <rect x="685" y="252" width="230" height="112" rx="12" fill="#222a3d" stroke="#2fd9f4" stroke-width="2"/><text x="800" y="292" text-anchor="middle" class="label">Visão operacional</text><text x="800" y="318" text-anchor="middle" class="body">correlaciona consumo,</text><text x="800" y="338" text-anchor="middle" class="body">qualidade e proveniência</text>
  <rect x="990" y="252" width="115" height="112" rx="12" fill="#171f33" stroke="#8dc63f"/><text x="1047" y="292" text-anchor="middle" class="label">Gates</text><text x="1047" y="318" text-anchor="middle" class="body">limiares</text><text x="1047" y="338" text-anchor="middle" class="body">e política</text>
  <path d="M280 250H370" class="edge"/><text x="325" y="238" text-anchor="middle" class="body">capacidade</text><path d="M280 285H330V386H370" class="edge"/><text x="332" y="370" class="body">qualidade e fontes</text><path d="M595 211H640V288H685" class="edge"/><path d="M595 386H640V328H685" class="edge"/><path d="M915 308H990" class="edge"/>
  <path d="M1047 364V470H185V325" class="feedback"/><text x="555" y="490" text-anchor="middle" class="body">alertar, revisar ou ajustar a seleção de contexto</text>
  <rect x="90" y="585" width="1010" height="32" rx="6" fill="#131b2e"/><text x="110" y="606" class="body">Tokens medem capacidade; aderência à tarefa e proveniência medem a qualidade da decisão.</text>
</svg>
