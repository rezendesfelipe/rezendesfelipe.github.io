<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Parâmetros do pipeline selecionam quais stacks Terraform rodam</title>
  <desc id="desc">Um painel de parâmetros (ambiente, ação e um checkbox por stack) alimenta o pipeline. O pipeline executa apenas as stacks marcadas: network, data e aks. Cada stack usa módulos reutilizáveis e grava em um arquivo tfstate próprio no mesmo container de armazenamento. A stack de dados está desmarcada e não é executada.</desc>
  <defs>
    <style>text{font-family:Manrope,'Geist Sans',Arial,sans-serif;fill:#dae2fd}.title{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:28px;font-weight:700}.kicker{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;fill:#2fd9f4}.label{font-family:'Space Grotesk','Geist Sans',Arial,sans-serif;font-size:16px;font-weight:700}.body{font-size:13px;fill:#c6c6cd}.mono{font-family:'Geist Mono',Consolas,monospace;font-size:12px;fill:#7bd0ff}.edge{fill:none;stroke:#2fd9f4;stroke-width:2.2;marker-end:url(#a)}.skip{fill:none;stroke:#45464d;stroke-width:2;stroke-dasharray:6 5}.state{fill:none;stroke:#5bbfae;stroke-width:2;marker-end:url(#c)}</style>
    <marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#2fd9f4"/></marker>
    <marker id="c" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#5bbfae"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#0b1326"/><circle cx="1080" cy="70" r="230" fill="#2fd9f4" opacity=".035"/>
  <text x="60" y="56" class="kicker">PARÂMETROS → STACKS → TFSTATE</text>
  <text x="60" y="94" class="title">Quem roda é decidido no run, o isolamento é decidido no desenho</text>

  <!-- Painel de parâmetros -->
  <rect x="60" y="130" width="300" height="400" rx="16" fill="#171f33" stroke="#45464d"/>
  <text x="84" y="162" class="kicker">PARÂMETROS DO RUN</text>
  <text x="84" y="196" class="label">environment</text><text x="84" y="216" class="mono">dev | hml | prd</text>
  <text x="84" y="252" class="label">action</text><text x="84" y="272" class="mono">plan | apply</text>
  <rect x="84" y="296" width="252" height="52" rx="10" fill="#222a3d" stroke="#2fd9f4" stroke-width="2"/>
  <text x="104" y="327" class="label">☑ network</text>
  <rect x="84" y="360" width="252" height="52" rx="10" fill="#222a3d" stroke="#45464d"/>
  <text x="104" y="391" class="label" style="fill:#c6c6cd">☐ data</text>
  <rect x="84" y="424" width="252" height="52" rx="10" fill="#222a3d" stroke="#2fd9f4" stroke-width="2"/>
  <text x="104" y="455" class="label">☑ aks</text>
  <text x="84" y="506" class="body">Valores fora da lista são recusados</text>

  <!-- Pipeline -->
  <rect x="420" y="130" width="230" height="400" rx="16" fill="#171f33" stroke="#2fd9f4" stroke-width="2"/>
  <text x="444" y="162" class="kicker">PIPELINE ÚNICO</text>
  <text x="444" y="200" class="label">Orquestração</text>
  <text x="444" y="224" class="body">lê os parâmetros e</text><text x="444" y="244" class="body">monta só os stages</text><text x="444" y="264" class="body">que foram pedidos</text>
  <text x="444" y="312" class="label">Template de stack</text>
  <text x="444" y="336" class="body">init → plan → (aprovação)</text><text x="444" y="356" class="body">→ apply</text>
  <text x="444" y="404" class="label">Identidade por ambiente</text>
  <text x="444" y="428" class="body">OIDC, sem segredo</text><text x="444" y="448" class="body">armazenado</text>

  <!-- Stacks -->
  <rect x="720" y="130" width="420" height="400" rx="16" fill="#171f33" stroke="#45464d"/>
  <text x="744" y="162" class="kicker">STACKS (UMA RAIZ TERRAFORM CADA)</text>
  <rect x="744" y="180" width="372" height="92" rx="10" fill="#222a3d" stroke="#2fd9f4" stroke-width="2"/>
  <text x="764" y="208" class="label">10-network</text><text x="764" y="230" class="body">usa modules/network</text><text x="764" y="252" class="mono">key = 10-network/dev.tfstate</text>
  <rect x="744" y="288" width="372" height="92" rx="10" fill="#222a3d" stroke="#45464d" stroke-dasharray="6 5"/>
  <text x="764" y="316" class="label" style="fill:#c6c6cd">20-data  (não selecionada)</text><text x="764" y="338" class="body">estado intacto, nada é lido nem alterado</text><text x="764" y="360" class="mono">key = 20-data/dev.tfstate</text>
  <rect x="744" y="396" width="372" height="92" rx="10" fill="#222a3d" stroke="#2fd9f4" stroke-width="2"/>
  <text x="764" y="424" class="label">30-aks</text><text x="764" y="446" class="body">usa modules/aks, lê a rede por data source</text><text x="764" y="468" class="mono">key = 30-aks/dev.tfstate</text>

  <path class="edge" d="M360 330H420"/>
  <path class="edge" d="M650 226H744"/>
  <path class="skip" d="M650 334H744"/>
  <path class="edge" d="M650 442H744"/>

  <!-- Backend -->
  <rect x="60" y="560" width="1080" height="64" rx="12" fill="#222a3d" stroke="#5bbfae" stroke-width="2"/>
  <text x="84" y="588" class="label" style="fill:#5bbfae">Backend remoto (Azure Storage)</text>
  <text x="84" y="609" class="body">um container, vários blobs: cada stack e cada ambiente tem o seu estado e o seu lock</text>
  <path class="state" d="M930 272V560" />
</svg>
